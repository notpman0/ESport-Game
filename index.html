<style>
*{box-sizing:border-box}body{margin:0;background:#101e23;color:#fff4d6;font:15px "Trebuchet MS",system-ui,sans-serif}main{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header,footer,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header,footer{padding:12px 3vw;background:#14282b}header{justify-content:space-between;border-bottom:1px solid #486260}h1,h2{font-family:Georgia,serif;margin:0}h1{font-size:clamp(18px,3vw,32px)}small,.muted{color:#b8cdc4}button,a{font:inherit;color:inherit}button,.link{background:#244041;border:1px solid #577474;border-radius:6px;padding:8px 12px;cursor:pointer;touch-action:manipulation}button:hover,.link:hover{background:#32524f}button:active{transform:scale(.96)}button:focus-visible,a:focus-visible{outline:3px solid #ffdc77}button:disabled{opacity:.53;cursor:default}button.active,.primary{background:#eec469;color:#222c29;border-color:#ffdf96}.field{position:relative;min-height:0;overflow:hidden;background:#314d40}canvas{display:block;width:100%;height:100%;touch-action:none}.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);padding:6px 13px;background:#101f23eb;border-radius:18px;text-align:center;width:max-content;max-width:90%;pointer-events:none}.overlay{position:absolute;inset:0;background:#0c1b20aa;display:grid;place-items:center}.panel{padding:clamp(14px,3vw,32px);background:#172e30;border:1px solid #778d79;box-shadow:0 15px 55px #08151888;border-radius:12px;max-width:min(460px,94%)}h2{font-size:clamp(25px,4vw,44px)}p{line-height:1.45}.link{text-decoration:none;display:inline-block}.time{font: bold 22px ui-monospace,monospace;color:#ffdb86}.sides{font-variant-numeric:tabular-nums}footer{justify-content:space-between;border-top:1px solid #58726a}footer .row{gap:5px}footer small{display:block;font-size:11px;margin-bottom:4px;letter-spacing:.09em;text-transform:uppercase}button.active span{color:#384438}button span{font-size:11px;color:#bbd0c6;display:block}button[hidden],[hidden]{display:none!important}@media(max-width:760px),(max-height:530px){header,footer{padding:5px 9px;gap:5px}button,.link{padding:5px 7px;font-size:12px}.hint{font-size:12px}.sides{font-size:11px}footer small{margin:0}header h1{font-size:19px}.panel p{margin:6px 0}}

<main><header><h1>Crownfront</h1><b class="sides" id="kings"></b><strong class="time" id="clock">06:00</strong><button id="help">How to play</button></header>
<section class="field"><canvas id="map" aria-label="River Crossing battlefield. Click to aim a volley or move the Commander."></canvas><div id="hint" class="hint" role="status"></div>
<div id="overlay" class="overlay"><section class="panel"><small>CLASSROOM EDITION · RIVER CROSSING</small><h2 id="title">Battle for the crown</h2><p id="intro">Lead one company across the bridge. Capture the red tower to break the King’s shield, then defeat him.</p><div class="row"><button class="primary" id="play">Play</button><a class="link" href="archive/2026-11-27/Crownfront.html">Custom match · Classic</a></div></section></div></section>
<footer><section><small>Company · ready</small><div class="row" id="companies"></div></section><section><small id="orderLabel">Orders</small><div class="row"><button data-cmd="attack">Attack</button><button data-cmd="hold">Hold</button><button data-cmd="rush">Rush [B]</button><button id="special"></button></div></section><section><small>Commander</small><div class="row"><button id="view">Take command [Tab]</button><button id="rally">Rally</button><button id="evolve" hidden>Evolve</button></div></section></footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('map'),ctx=canvas.getContext('2d');
const types=['Maces','Spears','Archers'],caps=[12,14,10],elite=['Morningstar','Lancer','Flaming Archer'],ranges=[29,40,174],colors=['#72d9ec','#ff8275'];
const sides=[{base:77,tower:243},{base:923,tower:757}],clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let game,phase='lobby',frameTime=0,view={s:1,x:0,y:0},aim={x:600,y:225},cameraX=500;
function soldier(team,type,index){return {team,type,index,hp:80,x:sides[team].base+(team?-1:1)*(60+index%4*13),y:187+Math.floor(index/4)*18,cd:index*.09,xp:0,elite:false}}
function army(team){return types.map((_,t)=>Array.from({length:caps[t]},(_,i)=>soldier(team,t,i)))}
function reset(){game={time:360,overtime:false,army:[army(0),army(1)],active:[0,0],king:[500,500],capture:[0,0],order:'hold',rush:0,brace:0,skill:0,rally:0,regen:0,ai:22,aiRush:0,enemySkill:8,fire:[0,0],hero:{x:170,y:226,hp:150,cd:0,down:0},target:null,command:false,aiming:false,fx:[],hint:'Press B to rush the red tower.',hintTime:15};cameraX=500}
function active(t){return game.army[t][game.active[t]].filter(u=>u.hp>0)}
function message(s){game.hint=s;game.hintTime=4}
function approach(o,p,s){let d=distance(o,p);if(d>1){o.x+=(p.x-o.x)*Math.min(1,s/d);o.y+=(p.y-o.y)*Math.min(1,s/d)}}
function line(a,b,color){game.fx.push({x:a.x,y:a.y,tx:b.x,ty:b.y,color,left:.24})}
function hit(a,b,n){b.hp=Math.max(0,b.hp-n);line(a,b,colors[a.team]||'#ffe29a');if(a.xp!==undefined)a.xp+=b.hp===0?8:2}
function swap(t,k){if(k===game.active[t]||!game.army[t][k].some(u=>u.hp>0))return;game.active[t]=k;if(t===0){game.rush=game.brace=0;game.aiming=false;game.order='attack';message(types[k]+' advancing. Reserves recover at the castle.')}}
// Inactive companies walk home. Restoring one casualty per company per interval preserves veteran identity.
function reserves(dt){game.regen+=dt;const refill=game.regen>=8;if(refill)game.regen-=8;for(let t=0;t<2;t++)game.army[t].forEach((group,k)=>{if(k===game.active[t])return;for(const u of group)if(u.hp>0){approach(u,{x:sides[t].base,y:225},85*dt);if(Math.abs(u.x-sides[t].base)<22)u.hp=Math.min(80,u.hp+7*dt)}if(refill){const dead=group.find(u=>!u.hp);if(dead)Object.assign(dead,soldier(t,k,dead.index),{x:sides[t].base})}})}
function order(key){if(phase!=='play')return;game.aiming=false;game.order=key;if(key==='rush'){game.rush=3;game.brace=0;message('Rush! Your company is closing the gap.')}else{game.rush=0;message(key==='hold'?'Holding position.':'Advancing on the objective.')}}
function signature(){if(phase!=='play'||game.skill>0||!active(0).length)return;const k=game.active[0];if(k===2){game.aiming=!game.aiming;message(game.aiming?'Click inside the blue range ring to place your volley.':'Aim cancelled.');return}game.skill=12;if(k===0){order('rush');message('Mace charge · heavy impact for 3 seconds.')}else{order('hold');game.brace=5;message('Spears braced · incoming damage reduced.')} }
function center(group){return group.length?{x:group.reduce((s,u)=>s+u.x,0)/group.length,y:group.reduce((s,u)=>s+u.y,0)/group.length}:{x:100,y:225}}
function volley(p){const c=center(active(0));if(distance(p,c)>260){message('Aim closer to your archers.');return}game.fx.push({x:p.x,y:p.y,r:52,left:.7,color:'#ffcf65'});for(const u of active(1))if(distance(p,u)<=52)hit(c,u,43);game.skill=12;game.aiming=false;message('Volley released.')}
function changeView(){if(phase!=='play')return;game.command=!game.command;game.aiming=false;message(game.command?'Commander · click to move or strike with your sword.':'Tactical view · choose a company order.')}
function rally(){if(phase!=='play'||game.rally>0||game.hero.down>0)return;game.rally=18;game.hero.hp=Math.min(150,game.hero.hp+50);for(const u of active(0))if(distance(u,game.hero)<145)u.hp=Math.min(80,u.hp+38);game.fx.push({...game.hero,r:145,left:.8,color:'#a3eed3'});message('Rally · nearby troops healed.')}
function eligible(){return active(0).find(u=>!u.elite&&u.xp>=24)}
function evolve(){const u=eligible();if(phase!=='play'||!u)return;u.elite=true;u.hp=80;message(elite[u.type]+' evolved · +50% damage.')}
function end(w){phase='end';$('title').textContent=w===0?'Victory':w===1?'Defeat':'Draw';$('intro').textContent='Blue King '+Math.ceil(game.king[0])+' HP · Red King '+Math.ceil(game.king[1])+' HP. '+(game.king.includes(0)?'The King has fallen.':'Time expired. Higher King health wins.');$('play').textContent='Play again';$('overlay').hidden=false}
function step(dt){const g=game;g.time-=dt;if(g.time<=0){if(g.king[0]===g.king[1]&&!g.overtime){g.overtime=true;g.time=45;message('Sudden death · 45 seconds.')}else{end(g.king[0]===g.king[1]?2:g.king[0]>g.king[1]?0:1);return}}
for(const k of ['rush','brace','skill','rally','aiRush','hintTime'])g[k]=Math.max(0,g[k]-dt);reserves(dt);g.ai-=dt;if(g.ai<=0||(!active(1).length&&g.ai<18)){g.ai=32;if(active(1).length<=4){const reserve=[0,1,2].filter(k=>k!==g.active[1]).sort((a,b)=>g.army[1][b].filter(u=>u.hp).length-g.army[1][a].filter(u=>u.hp).length);swap(1,reserve[0])}g.aiRush=3}
const forces=[active(0),active(1)],hero=g.hero;hero.cd=Math.max(0,hero.cd-dt);if(hero.hp<=0&&!hero.down)hero.down=9;if(hero.down){hero.down=Math.max(0,hero.down-dt);if(!hero.down)Object.assign(hero,{hp:150,x:125,y:225})}else{const p=g.command?g.target:center(forces[0]);if(p)approach(hero,{x:p.x-(g.command?0:20),y:p.y},(g.command?110:46)*dt);if(!hero.cd){const e=forces[1].find(u=>u.hp>0&&distance(hero,u)<39);if(e){hit(hero,e,22);hero.cd=.85}else if(g.capture[1]>=1&&Math.abs(hero.x-sides[1].base)<42){g.king[1]=Math.max(0,g.king[1]-14);hero.cd=.85}}}
for(let t=0;t<2;t++){const enemy=1-t,dir=t?-1:1,targetX=g.capture[enemy]<1?sides[enemy].tower:sides[enemy].base,targets=[...forces[enemy]];if(t&&!hero.down)targets.push(hero);
for(const u of forces[t]){if(!u.hp)continue;u.cd-=dt;const reach=ranges[u.type],nearest=targets.reduce((v,e)=>e.hp>0&&(!v||distance(u,e)<distance(u,v))?e:v,null);if(nearest&&distance(u,nearest)<reach){if(u.cd<=0){const counter=nearest.type===(u.type+1)%3,damage=(u.type===2?7:10)*(u.elite?1.5:1)*(counter?1.55:1)*(!t&&g.rush&&u.type===0?1.6:1)*(t&&g.brace&&nearest!==hero?.4:1);hit(u,nearest,damage);u.cd=u.type===2?1.55:1.25}continue}
if(g.capture[enemy]>=1&&Math.abs(u.x-targetX)<=reach&&u.cd<=0){g.king[enemy]=Math.max(0,g.king[enemy]-6*(u.elite?1.5:1));u.cd=1.6;line(u,{x:targetX,y:225},colors[t]);continue}
if(t||g.order!=='hold'){const chase=nearest&&distance(u,nearest)<reach+37;const dest=chase?nearest:{x:targetX-dir*(9+u.index%4*3),y:202+u.index%5*10};approach(u,dest,dt*(u.type===1?23:26)*((t?g.aiRush:g.rush)>0?2:1))}}
const tower=sides[t].tower;if(g.capture[t]<1){const near=forces[enemy].some(u=>u.hp&&Math.abs(u.x-tower)<42)||t===1&&!hero.down&&Math.abs(hero.x-tower)<42;const defended=forces[t].some(u=>u.hp&&Math.abs(u.x-tower)<48);if(near&&!defended){g.capture[t]=Math.min(1,g.capture[t]+dt/4);if(g.capture[t]===1)message(t?'Red shield broken · attack the King!':'Blue shield broken · defend your King!')}}
g.fire[t]-=dt;if(g.fire[t]<=0){const target=forces[enemy].find(u=>u.hp&&Math.abs(sides[t].base-u.x)<116)||(t===1&&hero.hp>0&&Math.abs(sides[t].base-hero.x)<116?hero:null);if(target){hit({x:sides[t].base,y:200,team:t},target,13);g.fire[t]=2.4}}}
if(!g.king[0]||!g.king[1])end(!g.king[1]?0:1);g.fx.forEach(f=>f.left-=dt);g.fx=g.fx.filter(f=>f.left>0)}
function path(points,fill,stroke){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function ring(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.strokeStyle=c;ctx.lineWidth=2;ctx.stroke()}
function label(x,y,s,c='#fff1c9'){ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.strokeStyle='#172e2d';ctx.lineWidth=3;ctx.strokeText(s,x,y);ctx.fillStyle=c;ctx.fillText(s,x,y)}
function fort(t,tower){const x=tower?sides[t].tower:sides[t].base,y=222,w=tower?21:39,clr=tower&&game.capture[t]>=1?colors[1-t]:colors[t];rect(x-w,y-22,w*2,45,'#273b41');rect(x-w+3,y-20,w*2-6,34,'#96a397');rect(x-w,y-26,w*2,7,'#c9c5a9');for(let j=0;j<5;j++)rect(x-w+j*w*.42,y-32,w*.3,9,'#b2b7a1');rect(x-6,y,12,18,'#304648');rect(x-1,y-50,2,23,'#ebd8a5');path([[x+1,y-50],[x+19,y-47],[x+1,y-39]],clr);if(tower&&game.capture[t]>0&&game.capture[t]<1){rect(x-20,y+24,40,4,'#263c40');rect(x-20,y+24,40*game.capture[t],4,colors[1-t])}label(x,y+44,tower?(game.capture[t]>=1?'CAPTURED':'WATCHTOWER'):(game.capture[t]<1?'♜ SHIELDED':'♜ EXPOSED'),clr)}
function draw(){const box=canvas.getBoundingClientRect(),w=box.width,h=box.height,dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}
const close=game.command||game.rush>0,scale=Math.min(w/(close?570:1000),h/310);if(!scale)return;let focus=game.command?game.hero.x:game.rush?center(active(0)).x:500;cameraX+=(clamp(focus,close?270:500,close?730:500)-cameraX)*.12;view={s:scale,x:w/2-cameraX*scale,y:h/2-222*scale};ctx.setTransform(dpr,0,0,dpr,0,0);rect(0,0,w,h,'#375849');ctx.translate(view.x,view.y);ctx.scale(scale,scale);
for(let i=0;i<90;i++){let x=(i*163)%1200-100,y=(i*71)%560-50;if(y>156&&y<284)continue;path([[x-13,y+9],[x,y-18],[x+13,y+9]],i%2?'#304f41':'#426750');path([[x-9,y],[x,y-23],[x+9,y]],'#50765b')}
path([[447,-500],[475,55],[445,150],[481,305],[443,900],[552,900],[569,310],[535,148],[563,60],[540,-500]],'#426f77','#749d93');for(let i=0;i<24;i++){let x=490+i*19%32,y=i*21-45;rect(x,y,12+i%8,1,'#80aba7')}
path([[-500,201],[470,192],[550,193],[1600,200],[1600,252],[550,247],[470,248],[-500,251]],'#9c8962');rect(439,185,123,71,'#524b3e');for(let i=0;i<17;i++)rect(441+i*7,188,6,64,i%2?'#b8a176':'#ac946c');rect(436,184,130,4,'#d8c598');rect(436,254,130,4,'#d8c598');label(500,278,'RIVER CROSSING');
for(let t=0;t<2;t++){fort(t,false);fort(t,true);game.army[t].forEach((group,k)=>{for(const u of group){if(!u.hp||k!==game.active[t]&&Math.abs(u.x-sides[t].base)<35)continue;const {x,y}=u;const dim=k!==game.active[t];ctx.globalAlpha=dim?.5:1;rect(x-5,y+3,11,4,'#324335');rect(x-4,y-7,9,11,colors[t]);rect(x-3,y-10,7,5,u.elite?'#ffda62':'#d2cabe');const d=t?-1:1;ctx.beginPath();ctx.moveTo(x+4*d,y);ctx.lineTo(x+(k===1?17:9)*d,y-(k===1?9:6));ctx.strokeStyle='#e2dfbb';ctx.lineWidth=k===0?3:1.6;ctx.stroke();if(k===2){ctx.beginPath();ctx.arc(x+4*d,y-3,6,-1.4,1.4);ctx.stroke()}if(!t&&!dim)path([[x-3,y-17],[x+3,y-17],[x,y-13]],'#ffdc66');if(u.hp<78){rect(x-5,y+8,10,2,'#293931');rect(x-5,y+8,u.hp/8,2,colors[t])}ctx.globalAlpha=1}})}
if(!game.hero.down){const {x,y}=game.hero;ring(x,y,10,'#f9da83');path([[x,y-12],[x+7,y],[x,y+6],[x-7,y]],'#fff0be');if(game.command)label(x,y-17,'YOU')}
if(game.aiming){const c=center(active(0));ring(c.x,c.y,260,'#a9e4f7');ring(aim.x,aim.y,52,distance(c,aim)<=260?'#ffdb74':'#ff8c79')}
for(const f of game.fx){ctx.globalAlpha=Math.min(1,f.left*3);if(f.r)ring(f.x,f.y,f.r,f.color);else{ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.tx,f.ty);ctx.strokeStyle=f.color;ctx.lineWidth=1.5;ctx.stroke()}}ctx.globalAlpha=1}
function hud(){const g=game,s=Math.max(0,Math.ceil(g.time));$('clock').textContent=(g.overtime?'OT ':'')+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('kings').textContent='Blue '+Math.ceil(g.king[0]/5)+'% '+(g.capture[0]<1?'◆':'◇')+'　·　'+(g.capture[1]<1?'◆':'◇')+' Red '+Math.ceil(g.king[1]/5)+'%';$('hint').textContent=g.hintTime>0?g.hint:g.capture[1]<1?'Capture the red watchtower':'Defeat the red King';for(let i=0;i<3;i++){const b=$('companies').children[i],n=g.army[0][i].filter(u=>u.hp>0).length;b.classList.toggle('active',g.active[0]===i);b.disabled=!n;b.lastChild.textContent=n+'/'+caps[i]}
document.querySelectorAll('[data-cmd]').forEach(b=>b.classList.toggle('active',b.dataset.cmd===g.order));$('special').textContent=['Mace charge','Brace','Aim volley'][g.active[0]]+(g.skill?' · '+Math.ceil(g.skill)+'s':'');$('special').disabled=g.skill>0||!active(0).length;$('rally').disabled=g.rally>0||g.hero.down>0;$('rally').textContent=g.hero.down?'Respawn '+Math.ceil(g.hero.down)+'s':g.rally?'Rally '+Math.ceil(g.rally)+'s':'Rally';$('view').textContent=g.command?'Map [Tab]':'Commander [Tab]';const e=eligible();$('evolve').hidden=!e;if(e)$('evolve').textContent='Evolve '+elite[e.type]+' · free'}
function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left-view.x)/view.s,y:(e.clientY-r.top-view.y)/view.s}}
canvas.onpointermove=e=>aim=point(e);canvas.onpointerdown=e=>{if(phase!=='play')return;const p=point(e);if(game.aiming)volley(p);else if(game.command)game.target={x:clamp(p.x,55,945),y:clamp(p.y,188,255)}};
types.forEach((t,i)=>{const b=document.createElement('button');b.append(t,document.createElement('span'));b.onclick=()=>{if(phase==='play')swap(0,i)};$('companies').append(b)});
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>order(b.dataset.cmd));$('view').onclick=changeView;$('special').onclick=signature;$('rally').onclick=rally;$('evolve').onclick=evolve;
let resume='lobby';$('help').onclick=()=>{if(phase==='help')return;resume=phase;phase='help';$('title').textContent='How to play';$('intro').textContent='Rush [B] toward the red tower. Hold it uncontested for 4s to expose the King. Swap companies to recover losses. Maces charge, Spears brace, Archers aim a volley. In Commander view [Tab], click to move and swing automatically in reach. Rally heals nearby allies. At six minutes, higher King health wins. A tie adds 45 seconds.';$('play').textContent='Back';$('overlay').hidden=false};
$('play').onclick=()=>{if(phase==='help'){phase=resume;if(phase==='play'){$('overlay').hidden=true;return}if(phase==='end'){end(game.king[0]===game.king[1]?2:game.king[0]>game.king[1]?0:1);return}$('title').textContent='Battle for the crown';$('intro').textContent='Capture the red watchtower, then defeat the King.';$('play').textContent='Play';return}reset();phase='play';$('overlay').hidden=true};
document.addEventListener('keydown',e=>{if(phase!=='play'||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;if(e.code==='KeyB'){order('rush');e.preventDefault()}if(e.code==='Tab'&&!e.shiftKey&&(document.activeElement===document.body||document.activeElement===canvas||!document.activeElement.matches(':focus-visible'))){changeView();e.preventDefault()}});$('play').addEventListener('click',()=>{if(phase==='play')document.activeElement.blur()});canvas.tabIndex=-1;
reset();let lastHud=-1;function frame(now){let dt=Math.min(.15,(now-frameTime)/1000);frameTime=now;if(phase==='play'&&!document.hidden)while(dt>.00001&&phase==='play'){let chunk=Math.min(dt,.04);step(chunk);dt-=chunk}draw();if(now-lastHud>100){hud();lastHud=now}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
